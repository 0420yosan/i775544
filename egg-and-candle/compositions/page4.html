<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="page4-template">
      <style>
        #p4-root { position: absolute; inset: 0; overflow: hidden; }
        #p4-root .sky-storm { position: absolute; inset: 0; background: linear-gradient(180deg, #1d243b 0%, #313b58 55%, #465372 100%); }
        #p4-root .sky-rain { position: absolute; inset: 0; background: linear-gradient(180deg, #2a3350 0%, #414d6c 55%, #5a6784 100%); }
        #p4-root .alley { position: absolute; inset: 0; background: #262c40; }
        #p4-root .flash { position: absolute; inset: 0; background: #f4f7ff; opacity: 0; }
        /* ink lettering lit up against the storm */
        #p4-root .lit img { filter: invert(1) sepia(0.5) saturate(2) brightness(1.02) drop-shadow(0 0 12px rgba(255, 234, 150, 0.6)); }
        #p4-root .lit-dim img { filter: invert(0.88) sepia(0.25) brightness(0.96) drop-shadow(0 0 8px rgba(215, 226, 255, 0.4)); }
      </style>

      <div id="p4-root" class="ec" data-composition-id="page4" data-width="1920" data-height="1080" data-duration="56.1">
        <!-- the ink page lands on page 3 and the camera pushes into the first panel -->
        <div id="p4-pagein" class="set clip" data-start="0" data-duration="6" data-track-index="1">
          <div class="desk" id="p4-desk" style="opacity: 0"></div>
          <div class="layer" id="p4-prev-out" style="left: 960px; top: 540px; opacity: 0">
            <div class="layer" id="p4-prev-cam"><div class="blank"></div></div>
          </div>
          <div class="layer" id="p4-pagein-out" style="left: 960px; top: 540px">
            <div class="layer" id="p4-pagein-cam"></div>
          </div>
        </div>

        <!-- A: "THUNDERING!" x3 -->
        <div id="p4-a" class="set clip" data-start="4.3" data-duration="7.3" data-track-index="2">
          <div class="fade" id="p4-a-fade">
            <div class="sky-storm"></div>
            <div class="screen" id="p4-a-rain-back"></div>
            <div class="layer" id="p4-a-shake"><div class="layer" id="p4-a-cam"></div></div>
            <div class="screen" id="p4-a-rain"></div>
          </div>
        </div>

        <!-- B: "What happen?" / "THUNDERING~" -->
        <div id="p4-b" class="set clip" data-start="11" data-duration="7.6" data-track-index="3">
          <div class="fade" id="p4-b-fade">
            <div class="sky-storm"></div>
            <div class="screen" id="p4-b-rain-back"></div>
            <div class="layer" id="p4-b-cam"></div>
            <div class="screen" id="p4-b-rain"></div>
          </div>
        </div>

        <!-- C: the rain, splashing -->
        <div id="p4-c" class="set clip" data-start="18.2" data-duration="3.2" data-track-index="4">
          <div class="fade" id="p4-c-fade">
            <div class="sky-rain"></div>
            <div class="layer" id="p4-c-cam"></div>
            <div class="screen" id="p4-c-rain"></div>
          </div>
        </div>

        <!-- D: lightning -->
        <div id="p4-d" class="set clip" data-start="21" data-duration="3.4" data-track-index="5">
          <div class="fade" id="p4-d-fade">
            <div class="sky-storm"></div>
            <div class="layer" id="p4-d-cam"></div>
            <div class="screen" id="p4-d-rain"></div>
          </div>
        </div>

        <!-- E: the search, "Where are you?" -->
        <div id="p4-e" class="set clip" data-start="24" data-duration="8.2" data-track-index="6">
          <div class="fade" id="p4-e-fade">
            <div class="sky-rain"></div>
            <div class="screen" id="p4-e-rain-back"></div>
            <div class="layer" id="p4-e-cam"></div>
            <div class="screen" id="p4-e-rain"></div>
          </div>
        </div>

        <!-- F: "On that day…", "Hello?" / "Are you in?" -->
        <div id="p4-f" class="set clip" data-start="31.8" data-duration="6.8" data-track-index="7">
          <div class="fade" id="p4-f-fade">
            <div class="sky-rain"></div>
            <div class="layer" id="p4-f-cam"></div>
            <div class="screen" id="p4-f-rain"></div>
          </div>
        </div>

        <!-- G: found in a corner, "Are you all right?" -->
        <div id="p4-g" class="set clip" data-start="38.2" data-duration="12.3" data-track-index="8">
          <div class="fade" id="p4-g-fade">
            <div class="alley"></div>
            <div class="layer" id="p4-g-cam"></div>
          </div>
        </div>

        <!-- lightning over every storm shot -->
        <div id="p4-fx" class="set clip" data-start="4.3" data-duration="34.3" data-track-index="9">
          <div class="flash" id="p4-flash"></div>
        </div>

        <!-- the page again, in color; ends centred for page 5 -->
        <div id="p4-pageout" class="set clip" data-start="50.1" data-duration="6" data-track-index="10">
          <div class="fade" id="p4-pageout-fade">
            <div class="layer" id="p4-pageout-out" style="left: 960px; top: 540px">
              <div class="layer" id="p4-pageout-cam"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const ART = {
            "egg-storm": { b: [140, 42, 401, 326], p: { spike: { b: [340, 80, 380, 150], pv: [345, 143] } } },
            "t-thund1": { b: [433, 48, 676, 112] },
            "t-thund2": { b: [652, 118, 876, 178] },
            "t-thund3": { b: [844, 207, 1086, 270] },
            "egg-worry": { b: [125, 374, 402, 672] },
            "think-what": { b: [324, 354, 600, 463] },
            "t-rumble1": { b: [627, 393, 856, 454] },
            "t-rumble2": { b: [563, 476, 797, 537] },
            "t-rumble3": { b: [483, 573, 717, 637] },
            splash1: { b: [886, 642, 974, 714] },
            splash2: { b: [976, 632, 1067, 720] },
            splash3: { b: [1066, 640, 1147, 701] },
            bolt1: { b: [86, 746, 167, 897] },
            bolt2: { b: [193, 783, 260, 924] },
            bolt3: { b: [130, 916, 177, 1010] },
            bolt4: { b: [216, 933, 257, 1010] },
            bolt5: { b: [210, 1033, 250, 1097] },
            "egg-umbrella": { b: [539, 721, 916, 1106] },
            "bub-where": { b: [842, 851, 1062, 992] },
            "cap-sky": { b: [84, 1119, 319, 1304] },
            dots1: { b: [202, 1309, 275, 1333] },
            "bub-hello": { b: [80, 1296, 185, 1373] },
            "bub-in": { b: [152, 1350, 336, 1443] },
            dots2: { b: [102, 1444, 164, 1468] },
            "candle-umbrella": { b: [434, 1109, 741, 1492] },
            "cap-found": { b: [873, 1126, 1142, 1412] },
            "bub-allright": { b: [882, 1404, 1141, 1491] },
          };
          const PANELS = {
            p4a: [[70, 14], [1160, 14], [1160, 308], [75, 331]],
            p4b: [[75, 331], [880, 318], [880, 716], [75, 716]],
            p4c: [[880, 318], [1160, 310], [1160, 712], [880, 716]],
            p4d: [[75, 716], [340, 716], [340, 1104], [75, 1104]],
            p4e: [[340, 716], [1160, 712], [1160, 1104], [340, 1104]],
            p4f: [[77, 1104], [340, 1104], [340, 1490], [77, 1488]],
            p4g: [[340, 1104], [873, 1106], [873, 1508], [340, 1492]],
            p4h: [[873, 1106], [1152, 1108], [1150, 1515], [873, 1508]],
          };
          const WASH = {
            p4a: ["#5d6a8c", "#a3adc4"], p4b: ["#6c7898", "#b0b9cd"], p4c: ["#7c88a6", "#bcc5d6"], p4d: ["#4f5b7c", "#98a3bc"],
            p4e: ["#7d89a7", "#c0c8d8"], p4f: ["#6e7a99", "#b3bccf"], p4g: ["#5a6484", "#a6aec3"], p4h: ["#e6dccd", "#f4ede2"],
          };

          const tl = gsap.timeline({ paused: true });
          const $ = (id) => document.getElementById(id);
          const { rng, el, svg, ridge } = EC;
          const K = EC.kit(tl, { page: 4, ART, PANELS, WASH });
          const { actor, bubble, label, art, buildPage, pageCam, cam, breathe, hop, waddle, tremble, pop, dropLabel, twinkle, wipeIn, revealLines, writeLines, rain, splashes, tears, shake, flash } = K;

          // panel-fit framing: a panel's page coordinates -> world (= screen at camera 1x)
          const frame = (x0, y0, x1, y1, z) => ({ z: z || Math.min(1920 / (x1 - x0), 1080 / (y1 - y0)), cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 });
          const S = (F, px, py) => [960 + F.z * (px - F.cx), 540 + F.z * (py - F.cy)];
          const place = (parent, id, name, F, opt) => { const [x0, , x1, y1] = ART[name].b; const [x, y] = S(F, (x0 + x1) / 2, y1); return actor(parent, id, name, F.z, x, y, opt); };
          const placeBubble = (parent, id, name, F, origin) => { const [x0, y0] = ART[name].b; const [x, y] = S(F, x0, y0); return bubble(parent, id, name, F.z, x, y, origin); };
          const placeLabel = (parent, id, name, F) => { const [x0, y0] = ART[name].b; const [x, y] = S(F, x0, y0); return label(parent, id, name, F.z, x, y); };
          const placeArt = (parent, id, name, F, css) => { const [x0, y0] = ART[name].b; const [x, y] = S(F, x0, y0); return art(parent, id, name, F.z, x, y, css); };

          // a drenched field at night: hill line, bare dark trees, wet ground with puddles
          function stormField(camEl, groundY, seed, x0 = -900, x1 = 2900) {
            const r = rng(seed);
            let trees = "";
            for (let x = x0; x < x1; x += 230 + r() * 160) {
              const h = 140 + r() * 150, y = groundY - 60 + r() * 20;
              trees += `<g transform="translate(${x} ${y})"><path d="M-5 0 L-4 ${-h * 0.55} L4 ${-h * 0.55} L5 0 Z" fill="#1c2336"/><ellipse cx="0" cy="${-h * 0.7}" rx="${h * 0.28}" ry="${h * 0.34}" fill="#222a40"/></g>`;
            }
            let puddles = "";
            for (let i = 0; i < 7; i++) {
              const px = x0 + 300 + r() * (x1 - x0 - 600), py = groundY + 60 + r() * 140, w = 120 + r() * 160;
              puddles += `<ellipse cx="${px}" cy="${py}" rx="${w}" ry="${w * 0.12}" fill="#5f6d8b"/><ellipse cx="${px - w * 0.2}" cy="${py - 2}" rx="${w * 0.45}" ry="${w * 0.03}" fill="#8894ae"/>`;
            }
            svg(camEl, 1, 1, "left:0;top:0", `<path d="${ridge(x1, groundY - 120, 110, 560, seed + 1, x0)}" fill="#2a3350"/>${trees}<path d="${ridge(x1, groundY, 40, 500, seed + 2, x0)}" fill="#434e69"/><path d="${ridge(x1, groundY, 40, 500, seed + 2, x0)}" fill="none" stroke="#56637f" stroke-width="12"/>${puddles}`);
          }
          // slide the next panel in from the right, like turning to the next frame
          function push(oldFade, newFade, t, dur = 0.5) {
            newFade.style.overflow = "hidden";
            const gutter = el("div", "abs", newFade, "left:0;top:0;width:30px;height:1080px;background:#fbf7ee;border-right:6px solid #2b1d17;box-sizing:border-box");
            tl.fromTo(newFade, { x: 1950 }, { x: 0, duration: dur, ease: "power3.inOut" }, t);
            tl.to(oldFade, { x: -700, duration: dur, ease: "power3.inOut" }, t);
            tl.fromTo(gutter, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t + dur - 0.1);
          }
          const FL = $("p4-flash");
          const heavyRain = (layer, seed, t0, t1, n = 70, alpha = 0.7) => rain(layer, n, seed, t0, t1, { len: [70, 130], width: [3, 5], speed: [1900, 2600], slant: -420, alpha });
          // lettering slammed onto the screen
          function slam(n, t, rot = -4) {
            tl.fromTo(n, { opacity: 0, scale: 1.7, rotation: rot * 2 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.28, ease: "power3.in" }, t);
            tl.fromTo(n, { x: -8 }, { x: 8, duration: 0.04, ease: "none", yoyo: true, repeat: 7, immediateRender: false }, t + 0.28);
            tl.to(n, { x: 0, duration: 0.05 }, t + 0.6);
          }

          // ================================================================ PAGE IN (0 – 6)
          const FA = frame(70, 14, 1160, 331);
          {
            // page 3 lies on the desk underneath (blank sheet at its final pose) once its slot ends
            tl.set($("p4-prev-cam"), { x: -0.62 * 600, y: -0.62 * 800, scale: 0.62 }, 0);
            tl.set($("p4-prev-out"), { rotation: -1.0 }, 0);
            tl.set([$("p4-desk"), $("p4-prev-out")], { opacity: 1 }, 1.45);
            const out = $("p4-pagein-out"), inner = $("p4-pagein-cam");
            const pg = buildPage(inner, false, ["egg-storm", "t-thund1", "t-thund2", "t-thund3"], [615, 172]);
            pageCam(inner, 0, 0, 600, 800, 0.62);
            tl.fromTo(out, { y: 1000, rotation: 7 }, { y: 0, rotation: 1.2, duration: 1.25, ease: "power3.out" }, 0.05);
            pageCam(inner, 1.9, 2.5, FA.cx, FA.cy, FA.z);
            tl.to(out, { rotation: 0, duration: 2.5, ease: "power2.inOut" }, 1.9);
            tl.fromTo(pg.group, { "--r": "0%" }, { "--r": "140%", duration: 1.3, ease: "power1.inOut" }, 3.4);
            tl.to(pg.washes.p4a, { opacity: 1, duration: 1.0, ease: "power1.inOut" }, 3.7);
          }

          // ================================================================ A (4.3 – 11.6): THUNDERING!
          {
            const c = $("p4-a-cam");
            stormField(c, 790, 11);
            const egg = place(c, "p4-a-egg", "egg-storm", FA);
            const T = ["t-thund1", "t-thund2", "t-thund3"].map((n, i) => placeArt(c, `p4-a-t${i}`, n, FA, "opacity:0;transform-origin:50% 50%"));
            T.forEach((n) => n.classList.add("lit"));
            const spike = egg.parts.spike;
            spike.style.filter = "invert(1) sepia(0.5) saturate(2) drop-shadow(0 0 6px rgba(255, 234, 150, 0.7))";
            tl.set(spike, { opacity: 0 }, 0);
            tl.fromTo($("p4-a-fade"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 4.4);
            cam(c, 4.3, 0, 960, 540, 1);
            breathe(egg, 4.3, 11.6, 0.01, 1.1);
            [5.3, 6.8, 8.3].forEach((t, i) => {
              flash(FL, t - 0.05, 0.85 - i * 0.05);
              shake($("p4-a-shake"), t + 0.25, 0.4, 16 - i * 3, 5 + i);
              slam(T[i], t, i % 2 ? 4 : -4);
              tl.to(egg.rig, { scaleY: 1.09, scaleX: 0.94, duration: 0.08, ease: "power2.out" }, t + 0.05);
              tl.to(egg.rig, { scaleY: 1, scaleX: 1, duration: 0.55, ease: "elastic.out(1, 0.35)" }, t + 0.13);
              tl.fromTo(spike, { opacity: 1, scale: 0.4 }, { scale: 1.15, duration: 0.18, ease: "back.out(3)", immediateRender: false }, t + 0.05);
              tl.to(spike, { scale: 1, duration: 0.3 }, t + 0.25);
            });
            tremble(egg, 8.6, 11.2, 1.6, 0.05);
            heavyRain($("p4-a-rain-back"), 21, 5.4, 11.6, 50, 0.45);
            heavyRain($("p4-a-rain"), 23, 5.4, 11.6, 34, 0.75);
            tl.fromTo([$("p4-a-rain-back"), $("p4-a-rain")], { opacity: 0 }, { opacity: 1, duration: 1.2 }, 5.4);
            tl.to(T, { opacity: 0, duration: 0.6, ease: "power1.in" }, 10.2);
            cam(c, 9.0, 2.6, 900, 560, 1.05, "sine.inOut");
          }

          // ================================================================ B (11 – 18.6): "What happen?" / THUNDERING~
          const FB = frame(75, 331, 880, 716);
          {
            const c = $("p4-b-cam");
            stormField(c, 870, 31);
            const egg = place(c, "p4-b-egg", "egg-worry", FB);
            const think = placeArt(c, "p4-b-think", "think-what", FB, "clip-path:inset(0% 100% 0% 0%)");
            const R = ["t-rumble1", "t-rumble2", "t-rumble3"].map((n, i) => placeArt(c, `p4-b-r${i}`, n, FB, "opacity:0;transform-origin:0% 50%"));
            R.forEach((n) => n.classList.add("lit-dim"));
            // the cut arrives on a flash
            flash(FL, 10.95, 0.9);
            tl.fromTo($("p4-b-fade"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 11.0);
            heavyRain($("p4-b-rain-back"), 33, 11.0, 18.6, 50, 0.45);
            heavyRain($("p4-b-rain"), 35, 11.0, 18.6, 30, 0.7);
            cam(c, 11.0, 0, 960, 540, 1);
            cam(c, 11.4, 7.0, 1000, 540, 1.05, "sine.inOut");
            breathe(egg, 11.0, 18.6, 0.012, 1.0);
            tremble(egg, 11.2, 12.4, 1.4, 0.05);
            // the little thought circles, then the thought
            [[82, 12.0], [76, 12.2], [70, 12.4], [0, 12.7]].forEach(([p, t]) => tl.set(think, { clipPath: `inset(0% ${p}% 0% 0%)` }, t));
            tl.fromTo(think, { scale: 0.95 }, { scale: 1, duration: 0.4, ease: "back.out(3)", transformOrigin: "0% 100%" }, 12.7);
            tl.to(egg.rig, { rotation: 4, duration: 0.6, ease: "sine.inOut" }, 12.8);
            // thunder rolling farther off
            [13.7, 14.9, 16.1].forEach((t, i) => {
              flash(FL, t - 0.1, 0.35 - i * 0.07);
              tl.fromTo(R[i], { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t);
              tl.fromTo(R[i], { skewX: -8 }, { skewX: 8, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, t);
              tl.to(R[i], { skewX: 0, duration: 0.3 }, t + 2.1);
              tl.fromTo(egg.breath, { x: -2 }, { x: 2, duration: 0.05, ease: "none", yoyo: true, repeat: 7, immediateRender: false }, t + 0.1);
              tl.to(egg.breath, { x: 0, duration: 0.05 }, t + 0.5);
            });
            tl.to(egg.rig, { rotation: -3, duration: 0.8, ease: "sine.inOut" }, 15.4);
            tl.to(egg.rig, { rotation: 0, duration: 0.8, ease: "sine.inOut" }, 17.2);
          }

          // ================================================================ C (18.2 – 21.4): rain on the ground
          const FC = { z: 2.4, cx: 1020, cy: 560 };
          {
            const c = $("p4-c-cam");
            svg(c, 1, 1, "left:0;top:0", `<rect x="-600" y="640" width="3200" height="700" fill="#46516c"/><rect x="-600" y="640" width="3200" height="14" fill="#5a6683"/><ellipse cx="960" cy="860" rx="820" ry="120" fill="#56627f"/><ellipse cx="820" cy="850" rx="420" ry="26" fill="#7b88a4"/>`);
            const sp = ["splash1", "splash2", "splash3"].map((n, i) => placeArt(c, `p4-c-s${i}`, n, FC, "transform-origin:50% 60%"));
            sp.forEach((n) => n.classList.add("lit-dim"));
            push($("p4-b-fade"), $("p4-c-fade"), 18.2);
            heavyRain($("p4-c-rain"), 41, 18.2, 21.4, 90, 0.8);
            splashes(c, 26, 43, 18.2, 21.4, 700, 1040, 100, 1820);
            cam(c, 18.2, 0, 960, 540, 1);
            cam(c, 18.7, 2.7, 960, 600, 1.1, "sine.inOut");
            sp.forEach((s, i) => {
              tl.fromTo(s, { scale: 0.88, rotation: -6 }, { scale: 1.1, rotation: 6, duration: 0.32 + i * 0.05, ease: "sine.inOut", yoyo: true, repeat: 9 }, 18.2 + i * 0.1);
            });
          }

          // ================================================================ D (21 – 24.4): lightning
          const FD = { z: 2.4, cx: 207.5, cy: 900 };
          {
            const c = $("p4-d-cam");
            svg(c, 1, 1, "left:0;top:0", `<path d="${ridge(2600, 1010, 90, 520, 51, -700)}" fill="#252d45"/>`);
            const bolts = ["bolt1", "bolt2", "bolt3", "bolt4", "bolt5"].map((n, i) => placeArt(c, `p4-d-b${i}`, n, FD, "opacity:0;transform-origin:50% 0%"));
            push($("p4-c-fade"), $("p4-d-fade"), 21.0);
            heavyRain($("p4-d-rain"), 53, 21.0, 24.4, 60, 0.6);
            cam(c, 21.0, 0, 960, 540, 1);
            cam(c, 21.4, 3.0, 960, 520, 1.06, "sine.inOut");
            [21.55, 22.1, 22.6, 23.05, 23.5].forEach((t, i) => {
              flash(FL, t, 0.55 + (i % 2) * 0.2);
              tl.fromTo(bolts[i], { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.09, ease: "power4.out", immediateRender: false }, t);
              tl.to(bolts[i], { opacity: 0.35, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.12);
            });
          }

          // ================================================================ E (24 – 32.2): "Where are you?"
          const FE = frame(340, 716, 1160, 1104);
          {
            const c = $("p4-e-cam");
            stormField(c, 990, 61);
            const egg = place(c, "p4-e-egg", "egg-umbrella", FE);
            const bWhere = placeBubble(c, "p4-e-bub-where", "bub-where", FE, "5% 50%");
            push($("p4-d-fade"), $("p4-e-fade"), 24.0);
            heavyRain($("p4-e-rain-back"), 63, 24.0, 32.2, 70, 0.55);
            heavyRain($("p4-e-rain"), 65, 24.0, 32.2, 18, 0.55);
            splashes(c, 18, 67, 24.0, 32.2, 1000, 1070, -100, 2000);
            cam(c, 24.0, 0, 960, 540, 1);
            // plodding in through the storm
            tl.fromTo(egg.root, { x: -760 }, { x: 0, duration: 2.8, ease: "sine.out" }, 24.1);
            waddle(egg, 24.1, 26.9, 0.36, 9, 3.5);
            breathe(egg, 27.0, 32.2, 0.012, 1.0);
            // looking this way and that
