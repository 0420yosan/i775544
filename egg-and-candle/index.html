<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="assets/lib/ec.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/lib/ec.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3ead6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3ead6;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #grain {
        position: absolute;
        inset: 0;
        background: url("assets/textures/paper-grain.png");
        mix-blend-mode: multiply;
        opacity: 0.32;
        pointer-events: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 58%, rgba(70, 42, 18, 0.22) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="234.4" data-width="1920" data-height="1080">
      <!-- page 1: title, the page coming alive, six panels, the colored page -->
      <div
        id="el-page1"
        data-composition-id="page1"
        data-composition-src="compositions/page1.html"
        data-start="0"
        data-duration="55.8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-page2"
        data-composition-id="page2"
        data-composition-src="compositions/page2.html"
        data-start="54.3"
        data-duration="61.8"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-page3"
        data-composition-id="page3"
        data-composition-src="compositions/page3.html"
        data-start="114.6"
        data-duration="65.2"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-page4"
        data-composition-id="page4"
        data-composition-src="compositions/page4.html"
        data-start="178.3"
        data-duration="56.1"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio id="el-score" src="assets/audio/page1-score.m4a" data-start="0" data-duration="55.8" data-track-index="10" data-volume="1"></audio>

      <!-- paper texture over the whole film -->
      <div id="grain"></div>
      <div id="vignette"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
