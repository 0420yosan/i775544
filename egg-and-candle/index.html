<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3ead6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="57" data-width="1920" data-height="1080">
      <!-- page 1 of the comic: title, the page coming alive, six panels, the colored page -->
      <div
        id="el-page1"
        data-composition-id="page1"
        data-composition-src="compositions/page1.html"
        data-start="0"
        data-duration="57"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio id="el-score" src="assets/audio/page1-score.m4a" data-start="0" data-duration="57" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
